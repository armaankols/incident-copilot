name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.lock
      - run: python -m pytest -q tests
      - run: python -m evals.retrieval_eval
      - run: python -m evals.run_evals --agent rules --n 60 --save-traces
      - run: python -m evals.run_evals --agent rules --suite correlated-v1 --n 24 --save-traces
      - run: python scripts/check_benchmarks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evaluations
          path: results/
