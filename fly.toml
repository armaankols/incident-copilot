# Personal Fly organization; one machine, monitored hosting target, approved $0.50 daily API start threshold.
app = "incident-copilot"
primary_region = "sjc"

[build]

[env]
  DAILY_BUDGET_USD = "0.50"
  RATE_LIMIT_PER_HOUR = "8"
  BUDGET_DB = "/data/demo.sqlite3"
  TRUST_FLY_PROXY = "1"
  # Measured socket peer on the existing machine; reverify if ingress changes.
  TRUSTED_PROXY_CIDRS = "172.16.38.2/32"

[[mounts]]
  source = "copilot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
